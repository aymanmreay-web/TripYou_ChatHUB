version: '3.8'

services:
  hub-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripyou-chathub-web
    restart: always
    networks:
      - n8n_default
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_DOMAIN=69.62.122.89.sslip.io
      - EVOLUTION_URL=https://evo.69.62.122.89.sslip.io
      - EVOLUTION_API_KEY=bc6075e9f95967407faae5d0fa9ac875a8d88a94782172db
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=n8n_default"
      - "traefik.http.routers.hub.rule=Host(`hub.69.62.122.89.sslip.io`)"
      - "traefik.http.routers.hub.entrypoints=websecure"
      - "traefik.http.routers.hub.tls=true"
      - "traefik.http.routers.hub.tls.certresolver=mytlschallenge"
      - "traefik.http.services.hub.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.hub-gz.compress=true"
      - "traefik.http.routers.hub.middlewares=hub-gz"

networks:
  n8n_default:
    external: true
